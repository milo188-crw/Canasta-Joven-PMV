<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canasta Joven — Sistema Contable-Administrativo</title>
<style>
:root{
  --lila:#8A6FD1; --lila-soft:#EDE7FB; --lila-mid:#C7B7EF;
  --rosa:#F7C6DB; --rosa-mid:#FFE1EC;
  --menta:#9FE3C8; --menta-mid:#E1FAF0;
  --amarillo:#FFE9A8; --amarillo-mid:#FFF6DA;
  --azul:#9FC7F0;
  --bg:#FAF8FD; --card:#FFFFFF; --text:#332B45; --muted:#7A7189;
  --ok:#3FB68A; --warn:#E3A93B; --bad:#E3675F; --info:#5C8FE0;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{margin:0 0 8px 0; font-weight:700;}
p{margin:0 0 6px 0;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}

header.top{
  position:sticky; top:0; z-index:20; background:linear-gradient(135deg,var(--lila),#9E82E0);
  color:white; padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; gap:10px; box-shadow:0 3px 12px rgba(120,90,190,.25);
}
header.top .logo{
  width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;overflow:hidden;flex-shrink:0;
}
header.top .titles{flex:1;}
header.top .titles b{display:block;font-size:17px;}
header.top .titles span{font-size:12px;opacity:.85;}
header.top .back{background:rgba(255,255,255,.2); border:none; color:white; border-radius:12px; padding:8px 12px; font-size:13px; display:none;}
header.top .back.show{display:block;}

main{padding:14px 14px 90px 14px; max-width:920px; margin:0 auto;}

.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}

.kpi{
  background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:0 2px 10px rgba(120,90,190,.08);
  border:1px solid #F0EBFA;
}
.kpi .label{font-size:12px; color:var(--muted); margin-bottom:4px;}
.kpi .value{font-size:19px; font-weight:800;}
.kpi.lila{background:var(--lila-soft);}
.kpi.rosa{background:var(--rosa-mid);}
.kpi.menta{background:var(--menta-mid);}
.kpi.amarillo{background:var(--amarillo-mid);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
.section-title h2{font-size:16px;}
.badge{font-size:11px; background:var(--lila-soft); color:var(--lila); padding:3px 9px; border-radius:20px; font-weight:700;}

.quick{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
@media(min-width:640px){.quick{grid-template-columns:repeat(6,1fr);}}
.quick button{
  background:white; border:1px solid #EFE9FB; border-radius:16px; padding:12px 6px;
  font-size:12px; font-weight:700; color:var(--text); text-align:center;
}
.quick button span{display:block; font-size:20px; margin-bottom:4px;}

.card{background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:0 2px 10px rgba(120,90,190,.08); border:1px solid #F0EBFA;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.02em; padding:6px 8px; border-bottom:2px solid var(--lila-soft);}
td{padding:8px; border-bottom:1px solid #F3EFFA; vertical-align:middle;}
.tablewrap{overflow-x:auto;}
tr:hover td{background:#FBF9FE;}

.pill{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; display:inline-block;}
.pill.ok{background:#E2F7EF; color:var(--ok);}
.pill.warn{background:#FCF1DC; color:var(--warn);}
.pill.bad{background:#FBE6E4; color:var(--bad);}
.pill.info{background:#E7EFFC; color:var(--info);}

.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center;}
.toolbar input[type=text],.toolbar select{
  padding:9px 12px; border-radius:12px; border:1px solid #E6DFF7; background:white; font-size:13px; flex:1; min-width:120px;
}
.btn{background:var(--lila); color:white; border:none; padding:10px 16px; border-radius:12px; font-weight:700; font-size:13px;}
.btn.ghost{background:white; color:var(--lila); border:1px solid var(--lila-mid);}
.btn.small{padding:7px 12px; font-size:12px;}
.btn.rosa{background:#E884AE;}
.btn.menta{background:#4CC198;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media(max-width:480px){.form-grid{grid-template-columns:1fr;}}
.form-grid label{font-size:11px; color:var(--muted); font-weight:700; display:block; margin-bottom:3px;}
.form-grid select,.form-grid input{width:100%; padding:9px; border-radius:10px; border:1px solid #E6DFF7;}
.form-grid .full{grid-column:1/-1;}

.scanbar{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:10px;}
.scanbar .grow{flex:1; min-width:180px;}

.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;}
.tabs button{background:white; border:1px solid #EFE9FB; padding:8px 14px; border-radius:14px; font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap;}
.tabs button.active{background:var(--lila); color:white; border-color:var(--lila);}

.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12px;}
.bar-row .lbl{width:110px; flex-shrink:0; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{flex:1; background:var(--lila-soft); border-radius:8px; height:14px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--lila),var(--rosa)); border-radius:8px;}
.bar-val{width:78px; text-align:right; font-weight:700; flex-shrink:0;}

nav.bottom{
  position:fixed; bottom:0; left:0; right:0; z-index:30; background:white;
  border-top:1px solid #EEE7FA; display:flex; overflow-x:auto;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -4px 14px rgba(120,90,190,.08);
}
nav.bottom button{
  flex:1; min-width:64px; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:10px; color:var(--muted); padding:6px 4px; border-radius:12px; font-weight:700;
}
nav.bottom button span{font-size:18px;}
nav.bottom button.active{color:var(--lila); background:var(--lila-soft);}

.hidden{display:none !important;}
.muted{color:var(--muted); font-size:12px;}
.right{text-align:right;}
.center{text-align:center;}
.flex-between{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.more{width:100%; margin-top:8px;}
.empty{padding:24px; text-align:center; color:var(--muted);}
.notice{background:var(--amarillo-mid); border:1px solid #F3E3AE; border-radius:12px; padding:10px 12px; font-size:12px; margin-bottom:10px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

/* ---------- persistencia ---------- */
function guardarLocal(){
  if(ROL==="instructor") return;
  try{ const prev=localStorage.getItem(STORAGE_KEY), h=hoyISO(); const a=JSON.parse(localStorage.getItem("cj_auto")||"null");

  catch(e){ /* si el almacenamiento no está disponible, se conserva solo en memoria */ }

function cargar(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.version===2){
        if(!parsed.config) parsed.config = configPorDefecto();
        parsed.config.modulos = Object.assign(configPorDefecto().modulos, parsed.config.modulos||{});
        DATA = parsed;
        return;
      }
    }
  }catch(e){}
  DATA = datosVacios();
  guardarLocal();

/* ---------- cálculos derivados ---------- */
function calcularResumen(usarRango){
  const enR=f=>!usarRango||((!RANGO.d||f>=RANGO.d)&&(!RANGO.h||f<=RANGO.h));
  const V=DATA.ventas.filter(v=>v.estado!=="Anulada"&&enR(v.fecha)), C=DATA.compras.filter(c=>c.estado!=="Anulada"&&enR(c.fecha)), G=DATA.gastos.filter(g=>enR(g.fecha));
  const ivaVentas = V.reduce((s,v)=>s+(v.iva||0),0);
  const ventasTotal = V.reduce((s,v)=>s+v.total-(v.iva||0),0);
  const comprasTotal = C.reduce((s,c)=>s+c.total,0);
  const gastosTotal = G.reduce((s,g)=>s+g.valor,0);
  const costoVentas = V.reduce((s,v)=> s + v.items.reduce((s2,it)=>{
      const p = DATA.productos.find(pp=>pp.codigo===it.producto);
      return s2 + (it.costo!=null? it.costo : (p? p.costo:0))*it.cantidad;
    },0),0);
  const utilidadBruta = ventasTotal - costoVentas;
  const mermas=(DATA.ajustes||[]).filter(a=>enR(a.fecha)).reduce((s,a)=>s+(a.dif<0?-a.dif*a.costo:0),0);
  const utilidadOperacional = utilidadBruta - gastosTotal - mermas;
  const cobrosClientes = V.filter(v=>v.formaPago==="Crédito").reduce((s,v)=>s+v.abono,0);
  const ventasEfectivo = V.reduce((s,v)=>s+(v.efectivo!=null?v.efectivo:(v.formaPago==="Efectivo"?v.total:0)),0);
  const pagosProveedores = C.reduce((s,c)=>s+(c.formaPago==="Crédito"?c.abono:(c.efectivo!=null?c.efectivo:c.abono)),0);
  const cxcTotal = V.filter(v=>v.formaPago==="Crédito").reduce((s,v)=>s+(v.total-v.abono),0);
  const cxpTotal = C.filter(c=>c.formaPago==="Crédito").reduce((s,c)=>s+(c.total-c.abono),0);
  const valorInventario = DATA.productos.reduce((s,p)=>s+p.stock*p.costo,0);
  const MC=(DATA.movCaja||[]).filter(m=>enR(m.fecha)); const movIn=MC.filter(m=>m.tipo==="Entrada").reduce((s,m)=>s+m.valor,0), movOut=MC.filter(m=>m.tipo==="Retiro").reduce((s,m)=>s+m.valor,0);
  const entradasCaja = DATA.cajaInicial + ventasEfectivo + cobrosClientes + movIn;
  const salidasCaja = pagosProveedores + gastosTotal + movOut;
  const saldoCaja = entradasCaja - salidasCaja;
  const stockBajo = DATA.productos.filter(p=>p.stock<=p.stockMin && p.stock>0).length;
  const agotados = DATA.productos.filter(p=>p.stock===0).length;
  const hoy = hoyISO();
  const ventasHoy = V.filter(v=>v.fecha===hoy).reduce((s,v)=>s+v.total,0);
  return {ivaVentas, mermas, movIn, movOut, ventasTotal, comprasTotal, gastosTotal, costoVentas, utilidadBruta, utilidadOperacional,
    cobrosClientes, ventasEfectivo, pagosProveedores, cxcTotal, cxpTotal, valorInventario,
    saldoCaja, stockBajo, agotados, hoy, ventasHoy};
}

/* ---------- exportar tablas (Excel/CSV, PDF, Imagen) ---------- */
async function guardarArchivo(filename, data, mime){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const downloads = await window.claude.use("downloads");
      if(downloads){
        const blob = (data instanceof Blob) ? data : new Blob([data], {type:mime});
        await downloads.save({filename, data:blob});
        return true;
      }
    }
  }catch(e){ /* si falla, seguimos con el método clásico */ }
  try{
    const blob = (data instanceof Blob) ? data : new Blob([data], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return true;
  }catch(e){
    alert("No se pudo descargar el archivo en este navegador.");
    return false;
  }
}
function exportarCSV(headers, rows, filename){
  const csv = headers.join(";") + "\n" + rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\n");
  guardarArchivo(filename+".csv", "\uFEFF"+csv, "text/csv;charset=utf-8;");
}
function exportarPDF(headers, rows, title, filename){
  const style = `<style>
    body{font-family:sans-serif;padding:24px;color:#332B45;}
    h1{font-size:18px;color:#8A6FD1;margin-bottom:14px;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th,td{border:1px solid #ddd;padding:6px 8px;text-align:left;}
    th{background:#8A6FD1;color:#fff;}
    tr:nth-child(even) td{background:#F6F3FC;}
  </style>`;
  const rowsHtml = rows.map(r=>`<tr>${r.map(c=>`<td>${c==null?"":c}</td>`).join("")}</tr>`).join("");
  const htmlDoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${filename}</title>${style}</head><body>
    <h1>${title||""}</h1>
    <table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rowsHtml}</tbody></table>
  </body></html>`;
  let w = null;
  try{ w = window.open("", "_blank"); }catch(e){ w = null; }
  if(w && !w.closed){
    w.document.write(htmlDoc);
    w.document.close();
    w.focus();
    setTimeout(()=>{ try{ w.print(); }catch(e){} }, 350);
  } else {
    guardarArchivo(filename+".html", htmlDoc, "text/html;charset=utf-8;");
    alert('Se descargó un archivo HTML (no se pudo abrir una ventana emergente aquí). Ábrelo y usa "Imprimir → Guardar como PDF" desde tu navegador.');
  }
}
function exportarImagen(headers, rows, title, filename){
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = "13px sans-serif";
  const padX = 24, rowH = 32, headerH = 40, titleH = title? 40:0;
  const widths = headers.map(h=>ctx.measureText(h).width + padX);
  rows.forEach(r=>r.forEach((c,i)=>{ widths[i] = Math.max(widths[i], ctx.measureText(String(c==null?"":c)).width + padX); }));
  const totalW = widths.reduce((a,b)=>a+b,0);
  canvas.width = totalW + 24;
  canvas.height = titleH + headerH + rows.length*rowH + 24;
  ctx.fillStyle = "#FAF8FD"; ctx.fillRect(0,0,canvas.width,canvas.height);
  let y = 12;
  if(title){ ctx.fillStyle="#332B45"; ctx.font="bold 18px sans-serif"; ctx.fillText(title, 12, y+22); y += titleH; }
  ctx.fillStyle = "#8A6FD1"; ctx.fillRect(12, y, totalW, headerH);
  ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif";
  let x = 12;
  headers.forEach((h,i)=>{ ctx.fillText(h, x+10, y+headerH/2+5); x += widths[i]; });
  y += headerH;
  ctx.font = "13px sans-serif";
  rows.forEach((r,ri)=>{
    ctx.fillStyle = ri%2===0 ? "#FFFFFF" : "#F0EBFA";
    ctx.fillRect(12, y, totalW, rowH);
    ctx.fillStyle = "#332B45";
    let x = 12;
    r.forEach((c,i)=>{ ctx.fillText(String(c==null?"":c), x+10, y+rowH/2+4); x += widths[i]; });
    y += rowH;
  });
  canvas.toBlob(blob=>{ guardarArchivo(filename+".png", blob, "image/png"); }, "image/png");
}
let TABLE_EXPORTS = {};
function celdasTexto(filaHtml){
  const tmp = document.createElement("table");
  tmp.innerHTML = filaHtml;
  const tr = tmp.querySelector("tr");
  if(!tr) return [];
  return Array.from(tr.children).map(td=>td.textContent.replace(/\s+/g," ").trim());
}
function nombreArchivoExport(base){
  const negocio = (DATA.config && DATA.config.nombre ? DATA.config.nombre : "canasta-joven").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  return `${base}-${negocio||"canasta-joven"}`;
}
function exportarTabla(key, tipo){
  const t = TABLE_EXPORTS[key];
  if(!t || !t.rows.length){ alert("No hay datos para exportar todavía."); return; }
  const filename = nombreArchivoExport(key);
  if(tipo==="csv") exportarCSV(t.headers, t.rows, filename);
  else if(tipo==="pdf") exportarPDF(t.headers, t.rows, t.titulo, filename);
  else exportarImagen(t.headers, t.rows, t.titulo, filename);
}
function tablaGenerica(opts){
  const key = opts.id;
  if(!(key in renderLimits)) renderLimits[key]=opts.pageSize||20;
  if(!(key in filters)) filters[key]="";
  const texto = filters[key].toLowerCase();
  const datosFiltrados = texto ? opts.datos.filter(r=>opts.filtro(r,texto)) : opts.datos;
  const visibles = datosFiltrados.slice(0, renderLimits[key]);
  let rows = visibles.map(opts.fila).join("");
  if(!visibles.length) rows = `<tr><td colspan="${opts.columnas.length}" class="empty">Aún no hay registros. Usa el formulario de arriba para agregar el primero.</td></tr>`;
  if(opts.exportar!==false){
    TABLE_EXPORTS[key] = {
      headers: opts.columnas.map(c=>c.label),
      rows: datosFiltrados.map(r=>celdasTexto(opts.fila(r))),
      titulo: opts.exportTitulo || (opts.titulo ? opts.titulo.charAt(0).toUpperCase()+opts.titulo.slice(1) : key)
    };
  }
  return `
  <div class="toolbar">
    <input type="text" placeholder="Buscar en ${opts.titulo||'esta lista'}..." value="${filters[key]}"
      oninput="filters['${key}']=this.value; renderLimits['${key}']=${opts.pageSize||20}; route(currentRoute,true);">
    <span class="muted">${datosFiltrados.length} registros</span>
  </div>
  ${opts.exportar!==false ? `<div class="toolbar">
    <button class="btn small" onclick="exportarTabla('${key}','csv')">📊 Excel (CSV)</button>
    <button class="btn small ghost" onclick="exportarTabla('${key}','pdf')">🧾 PDF</button>
    <button class="btn small ghost" onclick="exportarTabla('${key}','imagen')">🖼️ Imagen</button>
  </div>` : ""}
  <div class="tablewrap"><table>
    <thead><tr>${opts.columnas.map(c=>`<th>${c.label}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  ${datosFiltrados.length > renderLimits[key] ? `<button class="btn ghost more" onclick="renderLimits['${key}']+=20; route(currentRoute,true);">Cargar más</button>` : ""}
  `;
}

function graficoTopProductos(){
  const cant = {};
  DATA.ventas.forEach(v=>v.items.forEach(it=>{ cant[it.producto] = (cant[it.producto]||0) + it.cantidad; }));
  const top = Object.entries(cant).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max = Math.max(...top.map(t=>t[1]),1);
  return top.map(([cod,val])=>{
    const p = DATA.productos.find(pp=>pp.codigo===cod);
    return `<div class="bar-row"><div class="lbl">${p?p.nombre:cod}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(val/max*100).toFixed(0)}%"></div></div>
      <div class="bar-val">${val} und.</div></div>`;

const TIPO={
 venta:{p:"v",lista:"ventas",nom:"clienteNombre",ent:"cliente",campo:"precio",unit:"precioUnit",titulo:"Nueva venta",cod:"VT",btn:"menta",formas:["Efectivo","Transferencia","Mixto","Crédito"],etEnt:"Cliente",etPrecio:"Precio unitario"},
 compra:{p:"c",lista:"compras",nom:"proveedorNombre",ent:"proveedor",campo:"costo",unit:"costoUnit",titulo:"Nueva compra",cod:"CO",btn:"rosa",formas:["Contado","Transferencia","Mixto","Crédito"],etEnt:"Proveedor",etPrecio:"Costo unitario"}

let _match={venta:null,compra:null};
function vistaTx(t){

    </div>

    <p class="muted" id="${p}Msg" style="margin-top:6px;"></p>
    ${cart.length?`<div class="tablewrap"><table><thead><tr><th>Producto</th><th>Cant.</th><th>Unit.</th><th>Subtotal</th><th></th></tr></thead><tbody>
      ${cart.map((i,n)=>`<tr><td>${i.nombre}</td><td>${i.cantidad}</td><td>${fmt(i[T.unit])}</td><td>${fmt(i.subtotal)}</td><td><button class="btn small ghost" onclick="CART.${t}.splice(${n},1);route('${T.lista}',true)">✕</button></td></tr>`).join("")}
      </tbody></table></div>`:""}
    <div class="form-grid" style="margin-top:10px;">
      <div><label>${T.etEnt}</label><select id="${p}Ent">${opts}</select></div>

      <div><label>Efectivo (solo si es Mixto)</label><input type="number" id="${p}Ef" min="0" value="0"></div>
    </div>
    <button class="btn ${T.btn}" style="margin-top:10px;" onclick="finalizarTx('${t}')">Registrar ${t} · ${fmt(tot)}</button>
  </div>
  <div class="section-title"><h2>${t==="venta"?"Ventas":"Compras"} registradas · ${DATA[T.lista].length}</h2></div>
  ${tablaGenerica({
    id:T.lista, titulo:T.lista, pageSize:20,
    columnas:[{label:"ID"},{label:"Fecha"},{label:t==="venta"?"Cliente":"Proveedor"},{label:"Productos"},{label:"Total"},{label:"Forma de pago"},{label:"Estado"},{label:"Acciones"}],
    datos:[...DATA[T.lista]].sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id.localeCompare(a.id)),

  })}`;
}
function vistaCompras(){ return vistaTx("compra"); }
function vistaVentas(){ return vistaTx("venta"); }
function buscarTx(t){
  const T=TIPO[t],p=T.p, b=document.getElementById(p+"Barras").value.trim(), info=document.getElementById(p+"Info");
  const pr=DATA.productos.find(x=>x.barras===b||x.codigo===b);
  if(!pr){ _match[t]=null; info.innerHTML='<span class="pill bad">Código no encontrado. Registra el producto primero.</span>'; return; }
  _match[t]=pr.codigo; document.getElementById(p+"Precio").value=pr[T.campo];
  const enCart=CART[t].filter(i=>i.producto===pr.codigo).reduce((a,i)=>a+i.cantidad,0);
  info.innerHTML=`<span class="pill ok">${pr.nombre}</span> · Stock: ${pr.stock}${enCart?` · en carrito: ${enCart}`:""}`;
}
function agregarTx(t){
  const T=TIPO[t],p=T.p,msg=document.getElementById(p+"Msg");
  const pr=DATA.productos.find(x=>x.codigo===_match[t]);
  if(!pr){ msg.textContent="Busca un producto válido por su código de barras."; return; }
  const cant=Math.max(1,parseInt(document.getElementById(p+"Cantidad").value||"1"));
  const u=Math.max(0,parseFloat(document.getElementById(p+"Precio").value||pr[T.campo]));
  const yaEn=CART[t].filter(i=>i.producto===pr.codigo).reduce((a,i)=>a+i.cantidad,0);
  if(t==="venta"&&pr.stock<cant+yaEn){ msg.textContent=`Stock insuficiente (disponible: ${pr.stock}).`; return; }
  const it={producto:pr.codigo,nombre:pr.nombre,cantidad:cant,subtotal:cant*u}; it[T.unit]=u;
  if(t==="venta") it.costo=pr.costo;
  CART[t].push(it); _match[t]=null; route(T.lista,true);
}
function finalizarTx(t){
  const T=TIPO[t],p=T.p,msg=document.getElementById(p+"Msg"),cart=CART[t];
  if(!cart.length){ msg.textContent="Agrega al menos un producto al carrito."; return; }
  const ec=document.getElementById(p+"Ent").value;
  const ent=(t==="venta"?DATA.clientes:DATA.proveedores).find(x=>x.codigo===ec);
  if(!ent){ msg.textContent=`Selecciona (o registra) un ${T.etEnt.toLowerCase()}.`; return; }
  const forma=document.getElementById(p+"Forma").value, desc=Math.min(100,Math.max(0,parseFloat(document.getElementById(p+"Desc").value||"0")));
  const bruto=cart.reduce((a,i)=>a+i.subtotal,0), base=Math.round(bruto*(1-desc/100)), ivaPct=t==="venta"?(DATA.config.iva||0):0, iva=Math.round(base*ivaPct/100), total=base+iva;
  for(const i of cart){ const pr=DATA.productos.find(x=>x.codigo===i.producto); if(!pr) continue;
    if(t==="venta"){ pr.salidas+=i.cantidad; pr.stock-=i.cantidad; } else { pr.entradas+=i.cantidad; pr.stock+=i.cantidad; pr.costo=i.costoUnit; } }
  const cred=forma==="Crédito", id=siguienteCodigo(t,T.cod);
  const rec={id,fecha:hoyISO(),[T.ent]:ent.codigo,[T.nom]:ent.nombre,items:cart.map(i=>({...i,descuento:desc})),descuentoPct:desc,total,
    formaPago:forma,estado:cred?"Pendiente":"Pagada",abono:cred?0:total,vence:cred?(document.getElementById(p+"Vence").value||new Date(Date.now()+30*864e5).toISOString().slice(0,10)):""};
  if(t==="compra") rec.efectivo=forma==="Contado"?total:(forma==="Mixto"?Math.min(total,Math.max(0,parseFloat(document.getElementById(p+"Ef").value||"0"))):0);
  if(t==="venta"){ rec.comprobante=siguienteCodigo("_fv","FV"); rec.iva=iva; rec.ivaPct=ivaPct; rec.efectivo=forma==="Efectivo"?total:(forma==="Mixto"?Math.min(total,Math.max(0,parseFloat(document.getElementById(p+"Ef").value||"0"))):0); }
  DATA[T.lista].push(rec); CART[t]=[]; guardar(); route(T.lista,true);
  document.getElementById(p+"Msg").textContent=`${t==="venta"?"Venta":"Compra"} registrada: ${fmt(total)}`;
}
function anularTx(t,id){
  const T=TIPO[t],r=DATA[T.lista].find(x=>x.id===id);
  if(!r||r.estado==="Anulada"||!confirm(`¿Anular ${id}? Se revertirá el inventario.`)) return;
  for(const i of r.items){ const pr=DATA.productos.find(x=>x.codigo===i.producto); if(!pr) continue;
    if(t==="venta"){ pr.stock+=i.cantidad; pr.salidas-=i.cantidad; } else { pr.stock-=i.cantidad; pr.entradas-=i.cantidad; } }
  r.estado="Anulada"; guardar(); route(T.lista,true);
}
function recibo(id){
  const v=DATA.ventas.find(x=>x.id===id); if(!v) return;
  const w=window.open("","_blank"); if(!w){ alert("Permite las ventanas emergentes para ver el recibo."); return; }
  w.document.write(`<meta name="viewport" content="width=device-width"><body style="font-family:sans-serif;max-width:320px;margin:auto;padding:12px"><h3 style="text-align:center">${DATA.config.nombre}</h3><p style="text-align:center">${DATA.config.eslogan||""}</p><p>Comprobante: ${v.comprobante}<br>Fecha: ${fmtDate(v.fecha)}<br>Cliente: ${v.clienteNombre}</p><hr>${v.items.map(i=>`<p>${i.nombre}<br>${i.cantidad} x ${fmt(i.precioUnit)} = ${fmt(i.subtotal)}</p>`).join("")}<hr>${v.descuentoPct?`<p>Descuento: ${v.descuentoPct}%</p>`:""}${v.iva?`<p>IVA (${v.ivaPct}%): ${fmt(v.iva)}</p>`:""}<h3>Total: ${fmt(v.total)}</h3><p>${v.formaPago}${v.formaPago==="Crédito"?` · Saldo: ${fmt(v.total-v.abono)}`:""}</p><p style="text-align:center">¡Gracias por su compra!</p><script>setTimeout(()=>print(),300)<\/script>`);
  w.document.close();
}
function abonar(t,id){
  const r=DATA[TIPO[t].lista].find(x=>x.id===id); if(!r) return;
  const saldo=r.total-r.abono, v=parseFloat(prompt(`Saldo pendiente: ${fmt(saldo)}\n¿Cuánto abona?`,saldo)||"0");
  if(!(v>0)||v>saldo){ if(v>saldo) alert("El abono supera el saldo."); return; }
  r.abono+=v; if(r.total-r.abono<=0) r.estado="Pagada"; guardar(); route("finanzas",true);
}

    const datos=lista.filter(r=>r.formaPago==="Crédito"&&r.estado!=="Anulada");
    return `<div class="section-title"><h2>${titulo}</h2></div>`+tablaGenerica({

      datos, filtro:(r,q)=>r[nom].toLowerCase().includes(q),
      fila:r=>{ const saldo=r.total-r.abono; const est=saldo<=0?"Pagado":(r.vence&&r.vence<hoy?"Vencido":(r.vence&&r.vence<=new Date(Date.now()+5*864e5).toISOString().slice(0,10)?"Próximo a vencer":"Al día"));
        return `<tr><td>${r.id}</td><td>${r[nom]}</td><td>${fmt(r.total)}</td><td>${fmt(r.abono)}</td><td>${fmt(saldo)}</td><td>${fmtDate(r.vence)}</td><td>${estadoPill(est)}</td><td>${saldo>0?`<button class="btn small" onclick="abonar('${t}','${r.id}')">Abonar</button>`:"—"}</td></tr>`; }
    });
  };
  return tab("compra","Cuentas por pagar (a proveedores)",DATA.compras,"proveedorNombre")+tab("venta","Cuentas por cobrar (a clientes)",DATA.ventas,"clienteNombre");

function guardarIdentidad(){
  DATA.config.nombre = limpio(document.getElementById("cfNombre").value) || "Canasta Joven";

  DATA.config.descripcion = limpio(document.getElementById("cfDescripcion").value);

  const file = fileInput.files[0];
  const terminar = ()=>{ guardar(); renderHeader(); msg.textContent = "Identidad guardada."; route("configuracion", true); };
  if(file){
    const reader = new FileReader();
    reader.onload = ()=>{ DATA.config.logo = reader.result; terminar(); };
    reader.readAsDataURL(file);
  } else {
    terminar();
  }
}
function cambiarModulo(key, activo){
  DATA.config.modulos[key] = activo;
  guardar();
  initNav();
  if(!activo && currentRoute===key) route("inicio");
}
function exportarBackupJSON(){
  DATA.ultimoRespaldo=hoyISO(); guardar();
  guardarArchivo(`respaldo-${nombreArchivoExport("datos")}-${hoyISO()}.json`, JSON.stringify(DATA, null, 2), "application/json;charset=utf-8;");
}
function importarBackupJSON(){
  const input = document.getElementById("cfImportFile");
  const msg = document.getElementById("cfBackupMsg");
  const file = input.files[0];
  if(!file){ msg.textContent = "Selecciona primero un archivo .json de respaldo."; return; }
  if(!confirm("Esto reemplazará todos los datos actuales por los del archivo importado. ¿Continuar?")) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || parsed.version!==2){ msg.textContent = "El archivo no parece un respaldo válido de este sistema."; return; }
      if(!parsed.config) parsed.config = configPorDefecto();
      parsed.config.modulos = Object.assign(configPorDefecto().modulos, parsed.config.modulos||{});
      DATA = parsed;
      guardar();
      renderHeader();
      initNav();
      msg.textContent = "Datos importados correctamente.";
      route("inicio");
    }catch(e){ msg.textContent = "No se pudo leer el archivo. Verifica que sea un respaldo válido de este sistema."; }
  };
  reader.readAsText(file);
}

function mostrarLogin(){
  let d=document.getElementById("login");
  if(!d){ d=document.createElement("div"); d.id="login"; d.style.cssText="position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px"; document.body.appendChild(d); }
  d.innerHTML=`<div class="card" style="width:100%;max-width:340px;text-align:center"><h2>${DATA.config.nombre}</h2><p class="muted" style="margin-bottom:10px">Elige tu perfil e ingresa tu PIN</p>
  <div class="form-grid" style="grid-template-columns:1fr"><select id="lgRol"><option value="dueno">Dueño / Administrador</option><option value="vendedor">Vendedor</option><option value="instructor">Instructor SENA (solo lectura)</option></select>
  <input type="password" id="lgPin" inputmode="numeric" placeholder="PIN" onkeyup="if(event.key==='Enter')validarLogin()"></div>
  <button class="btn" style="margin-top:10px;width:100%" onclick="validarLogin()">Ingresar</button><p class="muted" id="lgMsg" style="margin-top:6px"></p><p class="muted" style="margin-top:6px">${NUBE?"☁️ Conectado a la nube":(SB_URL?"⚠️ Sin conexión con la nube"+(NUBE_ERR?" ("+NUBE_ERR+")":""):'<span style="text-decoration:underline;cursor:pointer" onclick="conectarNube()">☁️ Conectar a la nube</span>')}</p></div>`;
}
function validarLogin(){ const r=document.getElementById("lgRol").value; if(document.getElementById("lgPin").value!==pinDe(r)){ document.getElementById("lgMsg").textContent="PIN incorrecto."; return; } entrar(r); }
function entrar(r){
  ROL=r; try{ sessionStorage.setItem("cj_rol",r); }catch(e){}
  const l=document.getElementById("login"); if(l) l.remove();
  if(!document.getElementById("salirBtn")){ const b=document.createElement("button"); b.id="salirBtn"; b.className="back show"; b.textContent="Salir · "+ROL_NOM[r]; b.onclick=salir; document.querySelector("header.top").appendChild(b); }
  initNav(); route("inicio");
}
async function salir(){ try{ if(SB) await SB.auth.signOut(); }catch(e){} try{ sessionStorage.removeItem("cj_rol"); }catch(e){} location.reload(); }
function aplicarRol(){
  const m=document.getElementById("main");
  if(ROL==="dueno"&&currentRoute==="inicio"){ const d=DATA.ultimoRespaldo?Math.floor((Date.now()-new Date(DATA.ultimoRespaldo+"T00:00:00"))/864e5):999;
    if(d>7) m.insertAdjacentHTML("afterbegin",`<div class="notice">⚠️ ${DATA.ultimoRespaldo?`Hace ${d} días`:"Nunca"} exportaste un respaldo. <b style="cursor:pointer;text-decoration:underline" onclick="route('configuracion')">Hacerlo ahora</b></div>`); }
  const quitar=re=>m.querySelectorAll("button[onclick]").forEach(b=>{ if(re.test(b.getAttribute("onclick"))) b.remove(); });
  if(ROL==="vendedor") quitar(/anularTx|editarReg|eliminarReg|devolver|aplicarAjuste|cerrarCaja/);
  if(ROL==="instructor"){
    quitar(/registr|guardar|anular|abonar|devolver|eliminar|editar|finalizar|agregar|borrar|importar|CART|aplicarAjuste|cerrarCaja|restaurar/i);
    m.querySelectorAll(".form-grid").forEach(f=>{ if(!f.querySelector("input[type=date][onchange]")) f.remove(); });
    m.querySelectorAll(".scanbar").forEach(f=>f.remove());
    m.querySelectorAll(".section-title").forEach(t=>{ if(/^(Nuev|Registrar|Movimientos)/.test(t.textContent.trim())) t.remove(); });
    m.querySelectorAll("table select").forEach(x=>x.disabled=true);
    m.querySelectorAll(".card").forEach(c=>{ if(!c.textContent.trim()&&!c.querySelector("input,table")) c.remove(); });
  }
}
const CAMPOS={
 productos:[["nombre","Nombre"],["categoria","Categoría"],["marca","Marca"],["costo","Costo",1],["precio","Precio de venta",1],["stockMin","Stock mínimo",1],["vence","Vence (AAAA-MM-DD, vacío = no vence)"]],
 clientes:[["nombre","Nombre"],["tipo","Tipo"],["zona","Zona"],["telefono","Teléfono"],["medioPago","Medio de pago"]],
 proveedores:[["nombre","Nombre"],["tipo","Tipo"],["ciudad","Ciudad"],["contacto","Contacto"],["condiciones","Condiciones"]]
};
function acc(l,c){ return `<button class="btn small ghost" onclick="editarReg('${l}','${c}')">✏️</button> <button class="btn small ghost" onclick="eliminarReg('${l}','${c}')">🗑️</button>`; }
function editarReg(l,c){
  const r=DATA[l].find(x=>x.codigo===c); if(!r) return; const n={};
  for(const [k,lab,num] of CAMPOS[l]){ const v=prompt(lab,r[k]??""); if(v===null) return; n[k]=num?Math.max(0,parseFloat(v)||0):limpio(v); }
  Object.assign(r,n); if(l==="productos"&&r.costo>0) r.margen=Math.round((r.precio/r.costo-1)*100);
  guardar(); route(currentRoute,true);
}
function eliminarReg(l,c){
  const usado=l==="productos"?[...DATA.ventas,...DATA.compras].some(x=>x.items.some(i=>i.producto===c)):l==="clientes"?DATA.ventas.some(v=>v.cliente===c):(DATA.compras.some(x=>x.proveedor===c)||DATA.productos.some(p=>p.proveedor===c));
  if(usado){ alert("Tiene movimientos o productos asociados; no se puede eliminar."); return; }
  if(!confirm("¿Eliminar este registro?")) return;
  DATA[l]=DATA[l].filter(x=>x.codigo!==c); guardar(); route(currentRoute,true);
}
function badgeVence(p){ if(!p.vence) return ""; const h=hoyISO(), l=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
  return p.vence<h?' <span class="pill bad">Vencido</span>':(p.vence<=l?' <span class="pill warn">Vence pronto</span>':""); }
function devolver(id){
  const r=DATA.ventas.find(x=>x.id===id); if(!r||r.estado==="Anulada") return;
  const n=parseInt(prompt("¿Qué producto devuelve? (número)\n"+r.items.map((i,k)=>`${k+1}. ${i.nombre} (x${i.cantidad})`).join("\n"))||"0")-1, it=r.items[n];
  if(!it||it.cantidad<1) return;
  const q=parseInt(prompt(`Cantidad a devolver (máx ${it.cantidad})`,"1")||"0"); if(!(q>=1&&q<=it.cantidad)) return;
  const base=Math.round(it.precioUnit*q*(1-(r.descuentoPct||0)/100)), val=Math.round(base*(1+(r.ivaPct||0)/100));
  const pr=DATA.productos.find(x=>x.codigo===it.producto); if(pr){ pr.stock+=q; pr.salidas-=q; }
  it.cantidad-=q; it.subtotal=it.cantidad*it.precioUnit; r.total-=val; r.iva=Math.max(0,(r.iva||0)-(val-base));
  if(r.efectivo!=null) r.efectivo-=Math.min(r.efectivo,val); r.abono=Math.min(r.abono,r.total);
  (r.devoluciones=r.devoluciones||[]).push({fecha:hoyISO(),nombre:it.nombre,cantidad:q,valor:val});
  if(r.items.every(i=>i.cantidad===0)) r.estado="Anulada";
  guardar(); route("ventas",true);
}
function cajaExtra(){
  const cs=[...DATA.cierres].reverse().slice(0,5);
  return `<div class="section-title"><h2>Movimientos y cierre de caja</h2></div><div class="card">
  <div class="form-grid"><div><label>Tipo</label><select id="mcTipo"><option>Entrada</option><option>Retiro</option></select></div><div><label>Valor</label><input type="number" id="mcValor" min="0" value="0"></div><div class="full"><label>Motivo</label><input type="text" id="mcDesc" placeholder="Ej: retiro del dueño, cambio en monedas"></div></div>
  <button class="btn small" style="margin-top:8px" onclick="registrarMovCaja()">Registrar movimiento</button>
  <hr style="border:0;border-top:1px solid #eee;margin:12px 0">
  <div class="form-grid"><div><label>Efectivo contado en caja</label><input type="number" id="cierreContado" min="0"></div></div>
  <button class="btn small menta" style="margin-top:8px" onclick="cerrarCaja()">Cerrar caja</button><p class="muted" id="cajaMsg" style="margin-top:6px"></p>
  ${cs.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Esperado</th><th>Contado</th><th>Diferencia</th></tr></thead><tbody>${cs.map(c=>`<tr><td>${fmtDate(c.fecha)}</td><td>${fmt(c.esperado)}</td><td>${fmt(c.contado)}</td><td><span class="pill ${c.dif===0?"ok":"bad"}">${fmt(c.dif)}</span></td></tr>`).join("")}</tbody></table></div>`:""}</div>`;
}
function registrarMovCaja(){
  const v=Math.max(0,parseFloat(document.getElementById("mcValor").value||"0")); if(!v){ document.getElementById("cajaMsg").textContent="Ingresa un valor."; return; }
  DATA.movCaja.push({id:siguienteCodigo("movcaja","MC"),fecha:hoyISO(),tipo:document.getElementById("mcTipo").value,valor:v,desc:limpio(document.getElementById("mcDesc").value)||"Sin motivo"});
  guardar(); route(currentRoute,true);
}
function cerrarCaja(){
  const c=parseFloat(document.getElementById("cierreContado").value); if(isNaN(c)){ document.getElementById("cajaMsg").textContent="Escribe el efectivo contado."; return; }
  const e=calcularResumen().saldoCaja; DATA.cierres.push({fecha:hoyISO(),esperado:e,contado:c,dif:c-e}); guardar(); route(currentRoute,true);
}
function ajusteInv(){
  return `<div class="section-title"><h2>Inventario físico y mermas</h2></div><div class="card">
  <div class="form-grid"><div><label>Producto</label><select id="ajProd">${opcionesProductos()}</select></div><div><label>Conteo real</label><input type="number" id="ajReal" min="0"></div>
  <div class="full"><label>Motivo</label><select id="ajMotivo"><option>Conteo físico</option><option>Merma</option><option>Pérdida o robo</option><option>Producto vencido</option><option>Producto dañado</option></select></div></div>
  <button class="btn small" style="margin-top:8px" onclick="aplicarAjuste()">Aplicar ajuste</button><p class="muted" id="ajMsg" style="margin-top:6px"></p>
  ${DATA.ajustes.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Antes</th><th>Real</th><th>Motivo</th></tr></thead><tbody>${[...DATA.ajustes].reverse().slice(0,8).map(a=>`<tr><td>${fmtDate(a.fecha)}</td><td>${a.nombre}</td><td>${a.antes}</td><td>${a.real}</td><td>${a.motivo}</td></tr>`).join("")}</tbody></table></div>`:""}</div>`;
}
function aplicarAjuste(){
  const p=DATA.productos.find(x=>x.codigo===document.getElementById("ajProd").value), real=parseInt(document.getElementById("ajReal").value);
  if(!p||isNaN(real)||real<0){ document.getElementById("ajMsg").textContent="Elige un producto y escribe el conteo real."; return; }
  DATA.ajustes.push({fecha:hoyISO(),producto:p.codigo,nombre:p.nombre,antes:p.stock,real,dif:real-p.stock,costo:p.costo,motivo:document.getElementById("ajMotivo").value});
  p.stock=real; guardar(); route(currentRoute,true);
}
function vistaReportes(){
  const V=DATA.ventas.filter(v=>v.estado!=="Anulada"&&(!RANGO.d||v.fecha>=RANGO.d)&&(!RANGO.h||v.fecha<=RANGO.h));
  const agg=f=>{ const m={}; V.forEach(v=>f(v,m)); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const prod=agg((v,m)=>v.items.forEach(i=>{ m[i.nombre]=(m[i.nombre]||0)+i.cantidad; })).slice(0,8);
  const cli=agg((v,m)=>{ m[v.clienteNombre]=(m[v.clienteNombre]||0)+v.total; }).slice(0,8);
  const dia=agg((v,m)=>{ m[v.fecha]=(m[v.fecha]||0)+v.total; }).sort((a,b)=>a[0]<b[0]?-1:1).slice(-14);
  const bars=(l,f)=>{ const mx=Math.max(1,...l.map(x=>x[1])); return l.length?l.map(([k,v])=>`<div class="bar-row"><div class="lbl">${k}</div><div class="bar-track"><div class="bar-fill" style="width:${v/mx*100}%"></div></div><div class="bar-val">${f(v)}</div></div>`).join(""):'<p class="muted">Sin datos en este periodo.</p>'; };
  return `<div class="card"><div class="form-grid"><div><label>Desde</label><input type="date" value="${RANGO.d}" onchange="RANGO.d=this.value;route('finanzas',true)"></div><div><label>Hasta</label><input type="date" value="${RANGO.h}" onchange="RANGO.h=this.value;route('finanzas',true)"></div></div></div>
  <div class="section-title"><h2>Productos más vendidos (und.)</h2></div><div class="card">${bars(prod,x=>x)}</div>
  <div class="section-title"><h2>Mejores clientes</h2></div><div class="card">${bars(cli,fmt)}</div>
  <div class="section-title"><h2>Ventas por día</h2></div><div class="card">${bars(dia.map(([k,v])=>[fmtDate(k).slice(0,5),v]),fmt)}</div>`;
}
function cfgExtra(){
  let a=null; try{ a=JSON.parse(localStorage.getItem("cj_auto")||"null"); }catch(e){}
  return `<div class="section-title"><h2>Seguridad, IVA y copia automática</h2></div><div class="card">
  <div class="form-grid"><div><label>PIN dueño</label><input type="text" id="pinD" value="${pinDe("dueno")}"></div><div><label>PIN vendedor</label><input type="text" id="pinV" value="${pinDe("vendedor")}"></div>
  <div><label>PIN instructor SENA</label><input type="text" id="pinI" value="${pinDe("instructor")}"></div><div><label>IVA en ventas (%)</label><input type="number" id="cfIva" min="0" value="${DATA.config.iva||0}"></div></div>
  <button class="btn" style="margin-top:10px" onclick="guardarSeg()">Guardar</button><p class="muted" id="segMsg" style="margin-top:6px"></p>
  <p class="muted" style="margin-top:8px">Copia automática de inicio del día: ${a?fmtDate(a.f):"aún no hay"} <button class="btn small ghost" onclick="restaurarAuto()">Restaurar</button></p></div>`;
}
function guardarSeg(){
  DATA.config.pins={dueno:limpio(document.getElementById("pinD").value),vendedor:limpio(document.getElementById("pinV").value),instructor:limpio(document.getElementById("pinI").value)};
  DATA.config.iva=Math.max(0,parseFloat(document.getElementById("cfIva").value||"0")); guardar(); document.getElementById("segMsg").textContent="Guardado.";
}
function restaurarAuto(){
  let a=null; try{ a=JSON.parse(localStorage.getItem("cj_auto")||"null"); }catch(e){}
  if(!a||!confirm("Se reemplazarán los datos actuales por la copia del "+fmtDate(a.f)+". ¿Continuar?")) return;
  DATA=JSON.parse(a.d); guardar(); initNav(); route("inicio");
}


/* ---------- nube (Supabase) ---------- */
let NUBE_ERR="", SB=null, VER=0, NUBE=false, _pend=false, _subiendo=false, _cambios=0, _t=null;
function pendiente(){ try{ return localStorage.getItem("cj_pend")==="1"; }catch(e){ return false; } }
function setPend(v){ _pend=v; try{ if(v) localStorage.setItem("cj_pend","1"); else localStorage.removeItem("cj_pend"); }catch(e){} }
function setVer(v){ VER=v; try{ localStorage.setItem("cj_ver",String(v)); }catch(e){} }
function guardar(){ guardarLocal(); if(SB_URL&&SB_KEY&&ROL!=="instructor"){ if(NUBE) nubeGuardar(); else { _cambios++; setPend(true); } } }
function conectarNube(){ const u=prompt("URL del proyecto Supabase (https://xxxx.supabase.co)"); if(!u) return; const k=prompt("Clave anon public"); if(!k) return; try{ localStorage.setItem("cj_sb_url",u.trim()); localStorage.setItem("cj_sb_key",k.trim()); }catch(e){} location.reload(); }
function estadoNube(t){ const e=document.getElementById("nubeEst"); if(e) e.textContent=" · "+t; }
function aplicarNube(st){
  DATA=(st.data&&st.data.version===2)?st.data:datosVacios(); setVer(st.version);
  if(!DATA.config) DATA.config=configPorDefecto();
  DATA.config.modulos=Object.assign(configPorDefecto().modulos,DATA.config.modulos||{});
  guardarLocal();
}
function nubeGuardar(){ _cambios++; setPend(true); clearTimeout(_t); _t=setTimeout(subirNube,400); estadoNube("guardando…"); }
async function subirNube(){
  if(_subiendo||!SB) return; _subiendo=true; const c0=_cambios;
  try{
    const {data,error}=await SB.from("estado").update({data:DATA,version:VER+1,updated_at:new Date().toISOString()}).eq("id",1).eq("version",VER).select("version");
    if(error) throw error;
    if(!data||!data.length){ _subiendo=false; await conflictoNube(); return; }
    setVer(data[0].version);
    if(_cambios!==c0) _t=setTimeout(subirNube,300); else { setPend(false); estadoNube("☁️ guardado"); }
  }catch(e){ estadoNube("⚠️ sin conexión: cambios pendientes, se subirán solos"); }
  _subiendo=false;
}
async function conflictoNube(){ const {data:st}=await SB.from("estado").select("data,version").eq("id",1).single(); if(st) await resolverConflicto(st); }
async function resolverConflicto(st){
  const mio=DATA;
  const conservarMio=confirm("Otra persona guardó cambios en la nube mientras este dispositivo tenía cambios sin subir.\n\nAceptar = conservar lo de ESTE dispositivo (reemplaza la nube)\nCancelar = usar lo de la nube (se guarda una copia de lo de este dispositivo)");
  if(conservarMio){
    try{ guardarArchivo(`copia-nube-${hoyISO()}.json`,JSON.stringify(st.data,null,2),"application/json;charset=utf-8;"); }catch(e){}
    setVer(st.version); setPend(true); _cambios++; _t=setTimeout(subirNube,200);
  } else {
    try{ guardarArchivo(`copia-este-dispositivo-${hoyISO()}.json`,JSON.stringify(mio,null,2),"application/json;charset=utf-8;"); }catch(e){}
    aplicarNube(st); setPend(false); if(ROL){ initNav(); route(currentRoute,true); }
  }
}
async function conectarYSincronizar(){
  if(!SB){ if(!window.supabase){ NUBE_ERR="la librería de Supabase no cargó (internet o bloqueo del visor)"; return false; } SB=supabase.createClient(SB_URL,SB_KEY); }
  let st=null,error=null;
  try{ ({data:st,error}=await SB.from("estado").select("data,version").eq("id",1).single()); }catch(e){ error=e; }
  if(error||!st){ NUBE_ERR=(error&&(error.message||error.code))||"sin respuesta"; return false; }
  NUBE_ERR=""; NUBE=true;
  if(!(st.data&&st.data.version===2)){ setVer(st.version); nubeGuardar(); return true; }
  if(pendiente()){
    const base=parseInt(localStorage.getItem("cj_ver")||"-1");
    if(st.version===base){ VER=st.version; nubeGuardar(); } else await resolverConflicto(st);
    return true;
  }
  aplicarNube(st); return true;
}
async function iniciarSesion(){
  if(!SB_URL||!SB_KEY) return iniciarLocal();
  _pend=pendiente();
  document.querySelector("header.top .titles").insertAdjacentHTML("beforeend",'<span id="nubeEst"> · ☁️ conectando…</span>');
  const ok=await conectarYSincronizar();
  estadoNube(ok?(_pend?"☁️ subiendo pendientes…":"☁️ conectado"):"⚠️ sin conexión: los cambios quedan pendientes");
  renderHeader(); iniciarLocal();
  setInterval(ciclo,8000); window.addEventListener("online",ciclo);
  window.addEventListener("beforeunload",e=>{ if(_pend){ e.preventDefault(); e.returnValue=""; } });
}
async function ciclo(){
  if(_subiendo||!SB_URL) return;
  const libre=()=>!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||"");
  if(!NUBE){ if(await conectarYSincronizar()){ estadoNube("☁️ conectado"); if(ROL){ initNav(); if(libre()) route(currentRoute,true); } } return; }
  if(_pend){ subirNube(); return; }
  try{
    const {data}=await SB.from("estado").select("version").eq("id",1).single();
    if(data&&data.version>VER){ const {data:st}=await SB.from("estado").select("data,version").eq("id",1).single();
      if(st&&!_pend){ aplicarNube(st); if(ROL){ initNav(); if(libre()) route(currentRoute,true); } estadoNube("☁️ actualizado"); } }
  }catch(e){ estadoNube("⚠️ sin conexión"); }
}

/* ---------- arranque ---------- */
cargar();
renderHeader();
iniciarSesion();
</script>
